global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Spring Boot app: actuator chạy ở port nội bộ 8081
  - job_name: ecommerce-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app:8081"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
