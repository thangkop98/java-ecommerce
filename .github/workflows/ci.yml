name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push mới lên cùng nhánh sẽ hủy lần chạy cũ đang dở
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  # ---------- Job 1: build + chạy test với MySQL thật ----------
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Dùng lại service db trong docker-compose.yml để CI giống hệt môi trường local
      # (cùng MySQL 8.0, cùng lower-case-table-names=1)
      - name: Start MySQL
        run: docker compose up -d --wait db

      - name: Build & run tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3307/java-ecommerce?useSSL=false&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: ecommerce
          SPRING_DATASOURCE_PASSWORD: ecommerce

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Dump MySQL logs on failure
        if: failure()
        run: docker compose logs db

  # ---------- Job 2: build image, smoke test, push lên GHCR ----------
  docker:
    name: Docker build & smoke test
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (load vào local để smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ecommerce-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Chạy cả stack từ image vừa build và gọi thử các trang chính.
      # Bắt được lỗi chỉ xuất hiện khi chạy từ jar (vd: template path sai -> 500).
      - name: Smoke test
        run: |
          # --wait đợi HEALTHCHECK của image (actuator readiness) báo healthy
          docker compose up -d --no-build --wait --wait-timeout 180 app

          fail=0
          for path in / /login /register /products; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || fail=1
          done

          # Đăng nhập admin (tài khoản seed bởi DataInitializer) -> kiểm tra session JDBC
          code=$(curl -s -c /tmp/cj -o /dev/null -w "%{http_code}" \
            --data-urlencode "username=admin@gmail.com" \
            --data-urlencode "password=12345678" \
            http://localhost:8080/login)
          echo "POST /login -> $code"
          [ "$code" = "302" ] || fail=1

          code=$(curl -s -b /tmp/cj -o /dev/null -w "%{http_code}" http://localhost:8080/admin)
          echo "/admin (đã đăng nhập) -> $code"
          [ "$code" = "200" ] || fail=1

          if docker compose logs app | grep -q " ERROR "; then
            echo "::error::Log của app có dòng ERROR"
            fail=1
          fi

          exit $fail

      # Kiểm tra config Prometheus + alert rules hợp lệ và Prometheus scrape được metric của app
      - name: Monitoring check
        run: |
          docker compose up -d --no-build --wait prometheus
          docker compose exec -T prometheus promtool check config /etc/prometheus/prometheus.yml

          for i in $(seq 1 20); do
            health=$(curl -s http://localhost:9090/api/v1/targets \
              | jq -r '.data.activeTargets[] | select(.labels.job == "ecommerce-app") | .health')
            echo "ecommerce-app target: ${health:-unknown}"
            [ "$health" = "up" ] && exit 0
            sleep 3
          done
          echo "::error::Prometheus không scrape được metric của app"
          curl -s http://localhost:9090/api/v1/targets | jq '.data.activeTargets[] | {job: .labels.job, health, lastError}'
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Chỉ push khi merge vào main; PR chỉ build + test.
      # Dùng lại cache nên bước này gần như không build lại.
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
