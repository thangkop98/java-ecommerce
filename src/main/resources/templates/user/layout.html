<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
	<meta name="description" content="" />
	<meta name="author" content="" />
	<title>LaptopShop</title>
	<!-- Favicon-->
	<link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
	<!-- Bootstrap icons-->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
	<!-- Core theme CSS (includes Bootstrap)-->
	<link th:href="@{/css/home.css}" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
</head>

<body class="d-flex flex-column min-vh-100">
	<!-- Navigation-->
	<nav class="navbar navbar-expand-lg navbar-light bg-light" id="home-header">
		<div class="container px-4 px-lg-5">
			<a class="navbar-brand fw-bold text-success" style="font-size: 24px;" href="/">LaptopShop</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
				data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
				aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
			<div class="collapse navbar-collapse" id="navbarSupportedContent">
				<ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
					<li class="nav-item"><a class="nav-link active" aria-current="page" href="/">Trang chủ</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/products}">Sản phẩm</a></li>
				</ul>
				<div class="d-flex align-items-center gap-3">
					<a class="d-flex" th:href="@{/cart}" style="text-decoration: none;">
						<button class="btn btn-outline-success" type="submit">
							<i class="bi-cart-fill me-1"></i>
							Giỏ hàng
							<span class="badge bg-success text-white ms-1 rounded-pill" id="cart-count" th:text="${cartCount}">0</span>
						</button>
					</a>
					<div sec:authorize="isAuthenticated()">
						<div class="dropdown">
							<i class="bi bi-person-fill fs-3" style="cursor: pointer; color: #198754"
								data-bs-toggle="dropdown" aria-expanded="false"></i>
							<ul class="dropdown-menu" style="left: auto; right:0">
								<li><a class="dropdown-item" th:href="@{/manage-user}">Quản lý tài khoản</a></li>
								<li><a class="dropdown-item" th:href="@{/order-history}" style="border-bottom: 1px solid 
							#0000002d;">Lịch sử mua hàng</a></li>
								<li><a class="dropdown-item" th:href="@{/logout}">Đăng xuất</a></li>
							</ul>
						</div>
					</div>
					<div sec:authorize="isAnonymous()">
						<a th:href="@{/login}" class="btn">Đăng nhập</a>
					</div>

				</div>

			</div>
		</div>
	</nav>
	<!-- Header-->
	<header layout:fragment="banner">
	</header>
	<!-- Section-->
	<section class="py-5 flex-grow-1">
		<div class="container px-4 px-lg-5 mt-5" layout:fragment="content">
		</div>
	</section>

	<!-- toast message -->
	<div id="cart-toast" class="toast position-fixed top-0 end-0 m-3" role="alert">

		<div class="toast-header">
			<strong class="me-auto">Thông báo</strong>
			<button type="button" class="btn-close" data-bs-dismiss="toast">
			</button>
		</div>

		<div id="cart-toast-message" class="toast-body">
		</div>
	</div>
	<!-- end toast -->

	<!-- Footer-->
	<footer class="py-5 bg-success">
		<div class="container">
			<p class="m-0 text-center text-white">Copyright &copy; LaptopShop 2026</p>
		</div>
	</footer>
	<!-- Bootstrap core JS-->
	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
	<script th:src="@{/js/home.js}"></script>
	<script th:src="@{/js/cart.js}"></script>

	<th:block layout:fragment="scripts"></th:block>
</body>

</html>
