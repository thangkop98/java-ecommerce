<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{user/layout}">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
	<meta name="description" content="" />
	<meta name="author" content="" />
	<title>Thanh toán - LaptopShop</title>
</head>

<body>
	<!-- Section-->
	<section class="py-5">
		<div class="container px-4 px-lg-5 mt-5" layout:fragment="content">
			<div class="row mb-5">
				<div class="col-sm-6">
					<nav aria-label="breadcrumb">
						<ol class="breadcrumb float-sm-start">
							<li class="breadcrumb-item"><a href="/"
									style="text-decoration: none; color: #198754">Home</a></li>
							<li class="breadcrumb-item active" aria-current="page">Thông tin thanh toán</li>
						</ol>
					</nav>
				</div>
			</div>
			<div class="row">
				<table class="table" style="margin-bottom: 100px;">
					<thead>
						<tr>
							<th scope="col">Sản phẩm</th>
							<th scope="col">Tên</th>
							<th scope="col" class="text-center">Giá</th>
							<th scope="col" class="text-center">Số lượng</th>
							<th scope="col">Thành tiền</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="cartdetail : ${cartdetails}" th:data-cart-detail-id="${cartdetail.id}"
							th:data-price="${cartdetail.product.price}">
							<th scope="row">
								<img th:src="@{${cartdetail.product.thumbnail}}" width="80" height="80">
							</th>
							<td th:text="${cartdetail.product.name}" class="align-middle"></td>
							<td th:text="${#numbers.formatDecimal(cartdetail.product.price, 0, 'POINT', 0, 'COMMA') + ' đ'}"
								class="align-middle text-center">
							</td>
							<td class="align-middle text-center" th:text="${cartdetail.quantity}">
							</td>
							<td th:text="${#numbers.formatDecimal(cartdetail.product.price * cartdetail.quantity, 0, 'POINT', 0, 'COMMA') + ' đ'}"
								class="align-middle" th:id="'subtotal-' + ${cartdetail.id}"></td>
						</tr>
					</tbody>
				</table>
				<form class="row gx-4" method="post" th:action="@{/order/create}" th:object="${user}">
					<div class="col d-flex flex-column gap-3">
						<h3>Thông tin người nhận</h3>
						<div>
							<label for="username" class="form-label">Tên người nhận </label>
							<input type="text" class="form-control" id="username" th:field="*{username}">

						</div>
						<div>
							<label for="address" class="form-label">Địa chỉ người nhận </label>
							<input type="text" class="form-control" id="address" th:field="*{address}">

						</div>
						<div>
							<label for="phone" class="form-label">Số điện thoại </label>
							<input type="text" class="form-control" id="phone" th:field="*{phone}">

						</div>
						<a th:href="@{/cart}" class="d-flex align-items-center gap-2"
							style="cursor: pointer; text-decoration: none">
							<span style="color: #198754"> <i class="bi bi-arrow-left"></i> Quay lại giỏ hàng</span>
						</a>
					</div>
					<div class="col">
						<div class="d-flex flex-column rounded-3 p-3 gap-3" style="background-color: #e9ecef;">
							<h1>Thông tin thanh toán</h1>
							<hr>
							<div class=" d-flex justify-content-between"><span class="fw-bold">Phí vận
									chuyển:</span><span>0đ</span></div>
							<div class="d-flex justify-content-between"><span class="fw-bold">Hình
									thức:</span><span>Thanh
									toán
									khi nhận hàng (COD)</span></div>
							<div class="d-flex justify-content-between"><span class="fw-bold">Tổng số tiền:</span> <span
									th:text="${#numbers.formatDecimal(total, 0, 'POINT', 0, 'COMMA') + ' đ'}"></span>
							</div>
							<hr>
							<button type="submit" style="width: 50%" class="py-2 rounded-5 btn btn-outline-success">Xác
								nhận thanh
								toán</button>
						</div>


					</div>
				</form>
			</div>
		</div>
	</section>
</body>

</html>
