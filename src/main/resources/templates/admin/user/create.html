<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout}">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tạo mới người dùng</title>
</head>

<body>
	<main layout:fragment="content">
		<!--begin::App Content Header-->
		<div class="app-content-header">
			<!--begin::Container-->
			<div class="container-fluid">
				<!--begin::Row-->
				<div class="row">
					<div class="col-sm-6">
						<h1 class="mb-0 fs-3">Tạo mới người dùng</h1>
					</div>
					<div class="col-sm-6">
						<nav aria-label="breadcrumb">
							<ol class="breadcrumb float-sm-end">
								<li class="breadcrumb-item"><a href="/admin">Home</a></li>
								<li class="breadcrumb-item active" aria-current="page">Tạo mới người dùng</li>
							</ol>
						</nav>
					</div>
				</div>
				<!--end::Row-->
			</div>
			<!--end::Container-->
		</div>
		<!--end::App Content Header-->
		<!--begin::App Content-->
		<div class="app-content">
			<!--begin::Container-->
			<div class="container-fluid d-flex justify-content-center">
				<form class="row g-3 w-50" method="post" th:action="@{/admin/users/create}" th:object="${user}"
					enctype="multipart/form-data">
					<div class="col-md-6">
						<label for="email" class="form-label">Email</label>
						<input type="email" class="form-control" id="email" placeholder="Nhập email ..."
							th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
						<span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
							class="invalid-feedback"></span>
					</div>
					<div class="col-md-6">
						<label for="password" class="form-label">Mật khẩu</label>
						<div style="position: relative;"
							th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
							<input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu ..."
								th:field="*{password}"
								th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
							<svg id="seePasswordIcon" style="position: absolute; top: 50%; transform: translateY(-50%); right: 10px; cursor:pointer"
								xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
								class="bi bi-eye-fill" viewBox="0 0 16 16">
								<path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0" />
								<path
									d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7" />
							</svg>
							<svg id="hidePasswordIcon"
								style="position: absolute; top: 50%; transform: translateY(-50%); right: 10px; cursor:pointer; display:none"
								xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
								class="bi bi-eye-slash-fill" viewBox="0 0 16 16">
								<path
									d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7 7 0 0 0 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474z" />
								<path
									d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z" />
							</svg>
						</div>

						<span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"
							class="invalid-feedback"></span>
					</div>
					<div class="col-md-6">
						<label for="phone" class="form-label">Số điện thoại</label>
						<input type="text" class="form-control" id="phone" placeholder="Nhập số điện thoại ..."
							th:field="*{phone}" th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
						<span th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"
							class="invalid-feedback"></span>
					</div>
					<div class="col-md-6">
						<label for="fullName" class="form-label">Họ và tên</label>
						<input type="text" class="form-control" id="fullName" placeholder="Nhập họ và tên ..."
							th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
						<span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="invalid-feedback"></span>
					</div>
					<div class="col-12">
						<label for="address" class="form-label">Địa chỉ</label>
						<input type="text" class="form-control" id="address" placeholder="Nhập địa chỉ ..."
							th:field="*{address}">
					</div>
					<div class="col-md-6">
						<label for="role" class="form-label">Vai trò</label>
						<select id="role" class="form-select" th:field="*{role_id}"
							th:classappend="${#fields.hasErrors('role_id')} ? 'is-invalid' : ''">
							<option selected value="">- Chọn vai trò -</option>
							<option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}" />
						</select>
						<span th:if="${#fields.hasErrors('role_id')}" th:errors="*{role_id}"
							class="invalid-feedback"></span>
					</div>
					<div class="col-md-6">
						<label for="avatar" class="form-label">Ảnh đại diện</label>
						<input type="file" class="form-control" id="avatar" name="image" accept="image/png, image/jpeg">
					</div>
					<div class="col-md-6"></div>
					<div class="col-md-6">
						<img id="imagePreview" src="#" alt="Image preview" style="display: none; width: 200px;
						            height: 200px;
						            border-radius: 8px;">
					</div>
					<div class="col-12">
						<button type="submit" class="btn btn-primary">Thêm mới</button>
					</div>
				</form>

			</div>
			<!--end::Container-->
		</div>
		<!--end::App Content-->
	</main>

	<th:block layout:fragment="scripts">
		<script>
			const imageInput = document.getElementById('avatar');
			console.log('imageInput', imageInput)
			const imagePreview = document.getElementById('imagePreview');

			imageInput.addEventListener('change', function () {
				const file = this.files[0];
				console.log('file info', file)

				if (file) {
					imagePreview.src = URL.createObjectURL(file);
					imagePreview.style.display = 'block';
				} else {
					imagePreview.src = '#';
					imagePreview.style.display = 'none';
				}
			});
		</script>

		<script>
			document.addEventListener("DOMContentLoaded", function () {
				const seePassIcon = document.getElementById("seePasswordIcon");
				const hidePassIcon = document.getElementById("hidePasswordIcon");
				const inputPass = document.getElementById("password");
				if (seePassIcon && hidePassIcon && inputPass) {
					seePassIcon.addEventListener("click", function (e) {
						inputPass.setAttribute("type", "text");
						seePassIcon.style.display = "none";
						hidePassIcon.style.display = "block";

					})

					hidePassIcon.addEventListener("click", function (e) {
						inputPass.setAttribute("type", "password");
						seePassIcon.style.display = "block";
						hidePassIcon.style.display = "none";

					})
				}
			})
		</script>
	</th:block>

</body>

</html>
