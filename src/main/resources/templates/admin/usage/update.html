<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{admin/layout}">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cập nhật mục đích sử dụng</title>
</head>

<body>
	<main layout:fragment="content">
		<!--begin::App Content Header-->
		<div class="app-content-header">
			<!--begin::Container-->
			<div class="container-fluid">
				<!--begin::Row-->
				<div class="row">
					<div class="col-sm-6">
						<h1 class="mb-0 fs-3">Cập nhật mục đích sử dụng</h1>
					</div>
					<div class="col-sm-6">
						<nav aria-label="breadcrumb">
							<ol class="breadcrumb float-sm-end">
								<li class="breadcrumb-item"><a href="/admin">Home</a></li>
								<li class="breadcrumb-item active" aria-current="page">Cập nhật mục đích sử dụng</li>
							</ol>
						</nav>
					</div>
				</div>
				<!--end::Row-->
			</div>
			<!--end::Container-->
		</div>
		<!--end::App Content Header-->
		<!--begin::App Content-->
		<div class="app-content">
			<!--begin::Container-->
			<div class="container-fluid d-flex justify-content-center">
				<form class="row g-3 w-50" method="post" th:action="@{/admin/usage/update/{id}(id=${usage.id})}" th:object="${usage}">
					<input type="hidden" th:field="*{id}">
					<div class="col-md-6">
						<label for="name" class="form-label">Tên mục đích</label>
						<input type="text" class="form-control" id="name" placeholder="Nhập tên mục đích ..." th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
						<span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="invalid-feedback"></span>
					</div>
					
					<div class="col-md-6">
						<label for="status" class="form-label">Trạng thái</label>
						<select id="status" class="form-select" th:field="*{status}" th:classappend="${#fields.hasErrors('status')} ? 'is-invalid' : ''">
							<option selected value="active">Hoạt động</option>
							<option value="inactive">Không hoạt động</option>
						</select>
						<span th:if="${#fields.hasErrors('status')}" th:errors="*{status}" class="invalid-feedback"></span>
					</div>
					<div class="col-12">
						<button type="submit" class="btn btn-primary">Cập nhật</button>
					</div>
				</form>

			</div>
			<!--end::Container-->
		</div>
		<!--end::App Content-->
	</main>

</body>

</html>
