<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Đăng nhập</title>
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	<link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>
	<section class="min-vh-100 px-4 py-5" style="background-color: #508bfc;">
		<div class="row d-flex justify-content-center">
			<div class="card col-md-4">
				<h3 class="text-center mt-5">Đăng nhập</h3>
				<div class="card-body">
					<div th:if="${param.logout}" class="alert alert-success alert-dismissible" role="alert">
						<div>Đăng xuất thành công</div>
						<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
					</div>

					<div th:if="${param.expired}" class="alert alert-warning alert-dismissible" role="alert">
						<div>
							Phiên đăng nhập đã hết hạn
						</div>
						<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
					</div>

					<div th:if="${param.error}" class="alert alert-danger alert-dismissible" role="alert">
						<div>Email hoặc mật khẩu không chính xác</div>
						<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
					</div>
					<form method="post" th:action="@{/login}">
						<div data-mdb-input-init class="form-outline mb-4">
							<label class="form-label" for="form2Example1">Email</label>
							<input type="email" id="email" class="form-control" name="username" />
						</div>

						<div data-mdb-input-init class="form-outline mb-4">
							<label class="form-label" for="form2Example2">Mật khẩu</label>
							<div style="position: relative">
								<input type="password" id="password" class="form-control" name="password" />
								<svg id="seePasswordIcon"
									style="position: absolute; top: 50%; transform: translateY(-50%); right: 10px; cursor:pointer"
									xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
									class="bi bi-eye-fill" viewBox="0 0 16 16">
									<path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0" />
									<path
										d="M0 8s3-5.5 8-5.5S16 8 16 8s-3 5.5-8 5.5S0 8 0 8m8 3.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7" />
								</svg>
								<svg id="hidePasswordIcon"
									style="position: absolute; top: 50%; transform: translateY(-50%); right: 10px; cursor:pointer; display:none"
									xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
									class="bi bi-eye-slash-fill" viewBox="0 0 16 16">
									<path
										d="m10.79 12.912-1.614-1.615a3.5 3.5 0 0 1-4.474-4.474l-2.06-2.06C.938 6.278 0 8 0 8s3 5.5 8 5.5a7 7 0 0 0 2.79-.588M5.21 3.088A7 7 0 0 1 8 2.5c5 0 8 5.5 8 5.5s-.939 1.721-2.641 3.238l-2.062-2.062a3.5 3.5 0 0 0-4.474-4.474z" />
									<path
										d="M5.525 7.646a2.5 2.5 0 0 0 2.829 2.829zm4.95.708-2.829-2.83a2.5 2.5 0 0 1 2.829 2.829zm3.171 6-12-12 .708-.708 12 12z" />
								</svg>
							</div>
						</div>

						<div class="row mb-4">
							<div class="col d-flex justify-content-start">
								<!-- Checkbox -->
								<div class="form-check">
									<label class="form-check-label" for="form2Example31"> Ghi nhớ đăng nhập </label>
									<input class="form-check-input" type="checkbox" id="remember-me"
										name="remember-me" />
								</div>
							</div>
						</div>

						<!-- Submit button -->
						<button type="submit" data-mdb-button-init data-mdb-ripple-init
							class="btn btn-primary btn-block mb-4 w-100">Đăng nhập</button>

						<!-- Register buttons -->
						<div class="text-center">
							<p>Chưa có tài khoản? <a th:href="@{/register}" style="text-decoration: none;">Đăng ký</a></p>
						</div>
					</form>
				</div>
			</div>
		</div>
	</section>

	<!-- toast message -->
	<div>
		<div class="toast-container top-0 end-0 p-3">
			<div class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true"
				id="toast-register" th:classappend="${successMessage} ? 'text-bg-warning' : 'text-bg-danger'">
				<div class="d-flex">
					<div class="toast-body" th:if="${successMessage}" th:text="${successMessage}" />
					<div class="toast-body" th:if="${errorMessage}" th:text="${errorMessage}" />
					<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
						aria-label="Close"></button>
				</div>
			</div>
		</div>
	</div>
	<!-- end toast -->

	<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

	<script>
		document.addEventListener("DOMContentLoaded", function () {
			const seePassIcon = document.getElementById("seePasswordIcon");
			const hidePassIcon = document.getElementById("hidePasswordIcon");
			const inputPass = document.getElementById("password");
			if (seePassIcon && hidePassIcon && inputPass) {
				seePassIcon.addEventListener("click", function (e) {
					inputPass.setAttribute("type", "text");
					seePassIcon.style.display = "none";
					hidePassIcon.style.display = "block";

				})

				hidePassIcon.addEventListener("click", function (e) {
					inputPass.setAttribute("type", "password");
					seePassIcon.style.display = "block";
					hidePassIcon.style.display = "none";

				})
			}
		})
	</script>
	<script defer th:if="${successMessage != null or errorMessage != null}">
		const myToastEl = document.getElementById('toast-register');
		const myToast = bootstrap.Toast.getOrCreateInstance(myToastEl);
		myToast.show();
	</script>
</body>

</html>
