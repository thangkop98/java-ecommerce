spring.application.name=ecommerce

# config database
spring.datasource.url=jdbc:mysql://localhost:3306/java-ecommerce
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.web.error.include-message=always

# upload files storage
app.product-upload-dir-absolute=src/main/resources/static/uploads/product
app.product-upload-dir-relative=/uploads/product/
app.user-upload-dir-absolute=src/main/resources/static/uploads/user
app.user-upload-dir-relative=/uploads/user/

# session
server.servlet.session.timeout=30m
spring.session.jdbc.initialize-schema=never

# debug
#logging.level.org.springframework.security=DEBUG

# upload file size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# nếu baseline-on-migrate = true, spring tự tạo bảng lịch sử và coi db hiện tại là phiên bản gốc (v1)
# để = false thì sẽ báo lỗi nếu db đã có data nhưng chưa có bảng lịch sử -> thường dùng khi
# dùng true lần đầu với db đã có data do hibernate tạo, tạo bảng xong thì bật thành false, mặc định sau này cứ để false thôi
spring.flyway.baseline-on-migrate=false
#spring.flyway.baseline-version=1