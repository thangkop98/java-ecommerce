spring.application.name=ecommerce

# config database
spring.datasource.url=jdbc:mysql://localhost:3306/java-ecommerce
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.web.error.include-message=always

# upload files storage
app.product-upload-dir-absolute=src/main/resources/static/uploads/product
app.product-upload-dir-relative=/uploads/product/
app.user-upload-dir-absolute=src/main/resources/static/uploads/user
app.user-upload-dir-relative=/uploads/user/

# session
server.servlet.session.timeout=30m
spring.session.jdbc.initialize-schema=always

# debug
#logging.level.org.springframework.security=DEBUG

# upload file size
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB